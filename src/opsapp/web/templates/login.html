{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="panel signin">
  <h1>Sign in</h1>
  {% if error %}<div class="msg error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email }}" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <p><button>Continue</button></p>
  </form>
  <p class="small muted">Forgot your password or lost your phone? Ask an owner of your company to reset it.</p>
</div>
{% endblock %}
