[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "opsapp"
version = "0.1.0"
description = "Local prototype: request-to-quote workflow with approvals and simulated execution (fictional data only)."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.142,<0.143",
    "uvicorn>=0.54,<0.55",
    "jinja2>=3.1.6,<3.2",
    "sqlalchemy>=2.1.3,<2.2",
    "alembic>=1.20,<1.21",
    "pydantic>=2.13,<2.14",
    "python-multipart>=0.0.32,<0.1",
    "itsdangerous>=2.2,<2.3",
    "tzdata>=2026.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<9.2",
    "hypothesis>=6.168,<7",
    "httpx>=0.28,<0.29",
    "ruff>=0.16,<0.17",
    "mypy>=2.4,<2.5",
]

[project.scripts]
opsapp = "opsapp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opsapp = ["web/templates/*.html", "web/static/*", "migrations/script.py.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"src/opsapp/evals/*" = ["S"]

[tool.mypy]
python_version = "3.14"
packages = ["opsapp"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
